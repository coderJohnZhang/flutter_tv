name: flutter_tv
description: A TV launcher for Android TV and Linux TV OS, driven by a remote control.

publish_to: none
version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Localization delegates for material and widgets.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Used only by the optional remote layout source.
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/backgrounds/
    - images/posters/
    - images/channels/
    - images/apps/
    - images/sources/
    - config/
    - locale/
